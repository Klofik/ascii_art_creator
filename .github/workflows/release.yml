name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ascii_art_creator_linux
          - os: windows-latest
            artifact_name: ascii_art_creator_windows.exe
          - os: macos-latest
            artifact_name: ascii_art_creator_macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pillow
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --name ${{ matrix.artifact_name }} --hidden-import=ascii_art_gui gui.py

      - name: Upload Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
